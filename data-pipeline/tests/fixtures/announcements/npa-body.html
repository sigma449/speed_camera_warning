<div class="detail"><div class="editor"><div class="ed_model01 clearfix"><div class="ed_txt">
臺北市政府警察局交通警察大隊為加強維護交通安全，擇定本市1處多事故路口（和平西路與重慶南路口)，於115年7月1日起進行路口多功能科技執法設備測試(7月1日至9月30日為宣導期、10月1日正式啟用取締違規)，取締項目為「闖紅燈、車輛不停讓行人、不依標誌標線號誌指示行駛」。另為讓用路人養成良好駕駛習慣，於測試宣導期間(3個月內)將以掛號寄予違規民眾「違反道路交通管理事件宣導通知單」(免裁罰)，告知於測試期間有違規情形，並於該通知單內註明違規地點之科技執法設備將於何時正式啟用，提醒民眾務必遵守交通規則。
</div></div></div></div>
