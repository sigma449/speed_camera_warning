# XcodeGen 專案設定。在 macOS 上執行 `xcodegen generate` 會產生 SpeedCam.xcodeproj。
# GitHub Actions 會自動做這件事，所以 repo 裡不放 .xcodeproj。
name: SpeedCam
options:
  bundleIdPrefix: tw.speedcammap
  # 最低 iOS 15，只為了用舊手機（iPhone 7 最高 15.8）測 App 內的功能。
  # iOS 17 以上走原本的程式；舊系統的替代做法見 SpeedCam/Data/LegacySupport.swift。
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hant
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal

packages:
  SpeedCamCore:
    path: Packages/SpeedCamCore

targets:
  SpeedCam:
    type: application
    platform: iOS
    sources:
      - path: SpeedCam
      - path: Shared
    dependencies:
      - package: SpeedCamCore
      - target: SpeedCamWidgets
        embed: true
    info:
      path: Config/SpeedCam-Info.plist
      properties:
        # Info.plist 裡的名稱只能用英數字：SideStore／AltStore 會拿它去向 Apple 註冊 App ID，
        # Apple 不接受中文（錯誤訊息：invalid value … for the parameter 'appIdName'）。
        # 主畫面上的「測速地圖」由 SpeedCam/Resources/zh-Hant.lproj/InfoPlist.strings 提供。
        CFBundleDisplayName: SpeedCam
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - location
          - audio
        NSLocationWhenInUseUsageDescription: 需要你的位置，才能在接近測速照相時提醒你，並提供導航。
        NSLocationAlwaysAndWhenInUseUsageDescription: 需要你的位置，才能在螢幕關閉或使用其他 App 時持續提醒測速照相。
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tw.speedcammap.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # iOS 15 沒有 ActivityKit。一定要弱連結，否則 App 一開就閃退。
        OTHER_LDFLAGS: "$(inherited) -weak_framework ActivityKit"

  SpeedCamWidgets:
    type: app-extension
    platform: iOS
    # Live Activity 的畫面用到 iOS 18 的 API，所以維持 iOS 26。舊系統會裝 App，但不會載入這個 extension。
    deploymentTarget: "26.0"
    sources:
      - path: SpeedCamWidgets
      - path: Shared
    dependencies:
      - package: SpeedCamCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: ActivityKit.framework
    info:
      path: Config/SpeedCamWidgets-Info.plist
      properties:
        # 同上，只能用英數字（SideStore 會註冊成「SpeedCam SpeedCam Widgets」）。
        CFBundleDisplayName: SpeedCam Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tw.speedcammap.app.widgets
        SKIP_INSTALL: YES

schemes:
  SpeedCam:
    build:
      targets:
        SpeedCam: all
        SpeedCamWidgets: all
    run:
      config: Debug
    archive:
      config: Release
