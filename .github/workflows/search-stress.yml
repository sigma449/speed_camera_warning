name: 搜尋壓力測試

on:
  workflow_dispatch:
    inputs:
      runs:
        description: 重複幾次
        type: string
        default: "3"
      print-screenshots:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: stress-${{ github.ref }}-${{ inputs.runs }}
  cancel-in-progress: true

jobs:
  stress:
    uses: ./.github/workflows/_macos.yml
    with:
      task: stress
      label: search-stress
      runs: ${{ inputs.runs }}
      print-screenshots: ${{ inputs.print-screenshots }}
