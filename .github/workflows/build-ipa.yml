name: Build IPA（未簽署，側載用）

on:
  workflow_dispatch:
    inputs:
      acceptance:
        description: 同 commit、同資料跑完整驗收，全部通過才產生驗收 IPA
        type: boolean
        default: false
      screenshots:
        type: choice
        options: [full, smoke, gallery, map, search, styles, all, none]
        default: full
      print-screenshots:
        description: 將 base64 縮圖印入 log（預設只提供 artifact）
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ipa-${{ github.ref }}-${{ inputs.acceptance && 'acceptance' || 'standalone' }}-${{ inputs.screenshots || 'full' }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  acceptance:
    if: github.event_name == 'workflow_dispatch' && inputs.acceptance
    uses: ./.github/workflows/_acceptance.yml
    with:
      screenshots: ${{ inputs.screenshots }}
      print-screenshots: ${{ inputs.print-screenshots }}
  data:
    if: github.event_name != 'workflow_dispatch' || !inputs.acceptance
    uses: ./.github/workflows/_prepare-data.yml
    with:
      require-release: true
  ipa:
    needs: [data]
    uses: ./.github/workflows/_macos.yml
    with:
      task: ipa
      label: ipa
      manifest-sha: ${{ needs.data.outputs.manifest-sha }}
