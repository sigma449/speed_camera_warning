name: 舊版 iOS 模擬器探測（暫時）

# 查 GitHub 的 macOS runner 能不能安裝 iOS 15、16 的模擬器，用來在 CI 實際開啟 App。
on:
  workflow_dispatch:

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-15, macos-14]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - name: 環境
        run: |
          sw_vers
          uname -m
          ls -d /Applications/Xcode*.app
          xcodebuild -version
          xcrun simctl list runtimes
          xcrun simctl list devicetypes | grep -E "iPhone (6s|7|8|SE)" || true
      - name: Apple 的模擬器清單
        continue-on-error: true
        run: |
          curl -sSL https://devimages-cdn.apple.com/downloads/xcode/simulators/index2.dvtdownloadableindex -o index.plist
          plutil -convert json -o index.json index.plist
          python3 - <<'PY'
          import json
          data = json.load(open("index.json"))
          for d in data.get("downloadables", []):
              name = d.get("name", "")
              if "iOS 15" in name or "iOS 16" in name:
                  print(name, "|", d.get("source"), "|", d.get("authentication"), "|", d.get("contentType"),
                        "| arch", d.get("architectures"), "| host", d.get("hostRequirements"))
          PY
      - name: 下載 iOS 15.5
        continue-on-error: true
        run: |
          timeout 900 xcodebuild -downloadPlatform iOS -buildVersion 15.5 2>&1 | tail -20
          xcrun simctl list runtimes
      - name: 下載 iOS 16.4
        continue-on-error: true
        run: |
          timeout 900 xcodebuild -downloadPlatform iOS -buildVersion 16.4 2>&1 | tail -20
          xcrun simctl list runtimes
