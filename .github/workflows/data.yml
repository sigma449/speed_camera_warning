name: Refresh camera data

on:
  schedule:
    - cron: "17 18 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: data-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 準備本輪多來源完整資料
        id: bundle
        env:
          COMMIT: ${{ github.sha }}
        run: python3 scripts/ci/data-bundle.py prepare --commit "${COMMIT}" --release
      - name: 核對、安裝資料並產生來源／授權／回退說明
        env:
          COMMIT: ${{ github.sha }}
          MANIFEST_SHA: ${{ steps.bundle.outputs.manifest-sha }}
        run: |
          python3 scripts/ci/data-bundle.py verify --commit "${COMMIT}" --manifest-sha "${MANIFEST_SHA}" \
            --release --install SpeedCam/Resources/cameras.json
          python3 scripts/ci/data-pr-body.py --commit "${COMMIT}" --manifest-sha "${MANIFEST_SHA}"
      - name: 開 PR
        uses: peter-evans/create-pull-request@v7
        with:
          base: ${{ github.ref_name }}
          commit-message: 更新多來源測速照相資料
          branch: data/refresh
          delete-branch: true
          title: 更新多來源測速照相資料
          body-path: build/data-pr-body.md
          add-paths: SpeedCam/Resources/cameras.json
      - name: 保留本輪資料與原始建置證據
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-data
          path: |
            build/ci-data/
            build/data-pr-body.md
          if-no-files-found: warn
          retention-days: 14
