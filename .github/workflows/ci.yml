name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: 強制完整 CI（覆寫純文件分流）
        type: boolean
        default: false
      screenshots:
        type: choice
        options: [auto, smoke, gallery, map, search, full, styles, all, none]
        default: auto
      print-screenshots:
        description: 將 base64 縮圖印入 log（一般請下載 artifact）
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.classify.outputs.full }}
      screenshots: ${{ steps.classify.outputs.screenshots }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: 保守辨識跨層變更
        id: classify
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
          FORCE_FULL: ${{ inputs.full }}
        run: |
          args=()
          if [[ "${FORCE_FULL}" == true ]]; then args+=(--full); fi
          python3 scripts/ci/classify-changes.py --base "${BASE}" --head "${HEAD}" "${args[@]}"
  data:
    needs: [changes]
    if: needs.changes.outputs.full == 'true'
    uses: ./.github/workflows/_prepare-data.yml
    with:
      require-release: true
  tests:
    needs: [changes, data]
    uses: ./.github/workflows/_tests.yml
    with:
      manifest-sha: ${{ needs.data.outputs.manifest-sha }}
  ios-build:
    needs: [changes, data, tests]
    uses: ./.github/workflows/_macos.yml
    with:
      task: ios26
      label: ios26
      manifest-sha: ${{ needs.data.outputs.manifest-sha }}
      screenshots: ${{ inputs.screenshots && inputs.screenshots != 'auto' && inputs.screenshots || needs.changes.outputs.screenshots }}
      print-screenshots: ${{ inputs.print-screenshots || false }}
  summary:
    if: always()
    needs: [changes, data, tests, ios-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        if: needs.changes.outputs.full == 'true'
        continue-on-error: true
        with:
          name: ci-data
          path: build/summary/ci-data
      - uses: actions/download-artifact@v4
        if: needs.changes.outputs.full == 'true'
        continue-on-error: true
        with:
          pattern: "*-evidence"
          path: build/summary/evidence
      - name: CI 結果（缺證據不當通過）
        env:
          COMMIT: ${{ github.sha }}
          MANIFEST_SHA: ${{ needs.data.outputs.manifest-sha }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci/ci-results.py summary --scope ci
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-summary
          path: build/summary/
