name: 路線實測

on:
  workflow_dispatch:
    inputs:
      mode:
        description: plan 規劃、compare 避開設定對照、replay 模擬開車並驗收
        type: choice
        options: [plan, compare, replay]
        default: plan
      cases:
        description: scripts/ci 內的案例 JSON（保留自訂清單用法）
        default: scripts/ci/route-probe-cases.json
        type: string

permissions:
  contents: read

concurrency:
  group: probe-${{ github.ref }}-${{ inputs.mode }}-${{ inputs.cases }}
  cancel-in-progress: true

jobs:
  data:
    if: inputs.mode == 'replay'
    uses: ./.github/workflows/_prepare-data.yml
    with:
      require-release: true
  probe:
    needs: [data]
    if: ${{ !cancelled() && (inputs.mode != 'replay' || needs.data.result == 'success') }}
    uses: ./.github/workflows/_macos.yml
    with:
      task: probe
      label: route-probe
      mode: ${{ inputs.mode }}
      cases: ${{ inputs.cases }}
      manifest-sha: ${{ needs.data.outputs.manifest-sha }}
