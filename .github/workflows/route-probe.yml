name: 路線實測

# 用真正的 MapKit 規劃台灣的路線，比較不同避開設定實際走的路（重機路線要用哪種設定）。
# 不需要建置 App，幾分鐘就跑完。結果在 log 和 artifact route-probe。
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: 選擇 Xcode
        run: bash scripts/ci/select-xcode.sh
      - name: 路線實測
        run: bash scripts/ci/route-probe.sh route-probe-results.jsonl
      - name: 保留結果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: route-probe
          path: route-probe-results.jsonl
          retention-days: 30
          if-no-files-found: ignore
