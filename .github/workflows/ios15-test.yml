name: iOS 15 實際執行

on:
  workflow_dispatch:
    inputs:
      screenshots:
        type: choice
        options: [full, smoke, map, search, styles, all, none]
        default: full
      print-screenshots:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios15-${{ github.ref }}-${{ inputs.screenshots }}
  cancel-in-progress: true

jobs:
  data:
    uses: ./.github/workflows/_prepare-data.yml
  ios15:
    needs: [data]
    uses: ./.github/workflows/_macos.yml
    with:
      task: ios15
      label: ios15
      manifest-sha: ${{ needs.data.outputs.manifest-sha }}
      screenshots: ${{ inputs.screenshots }}
      print-screenshots: ${{ inputs.print-screenshots }}
